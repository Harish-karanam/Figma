<div class="warehouse-page">
  <div class="warehouse-content">
    <div class="heading-frame">
      <h2>Warehouse Information</h2>
      <p class="description">
        Please provide the information about the type of warehouse and relevant excise goods.
      </p>
    </div>

    <div class="section">
      <div class="fin-grp">
        <div class="inner-fin">
          <div class="info-row">
            <div class="info-item">
              <label>FIN</label>
              <p>3100286322000007</p>
            </div>

            <div class="info-item">
              <label>Business Name</label>
              <p>الشركة الصناعية للتموين والرخام إيثال شركة شخص واحد</p>
            </div>
          </div>

          <div class="field-group">
            <label>Warehouse Usage Purpose</label>
            <select>
              <option>Storage of the Excise Goods</option>
            </select>
          </div>

          <div class="field-group">
            <label
              >What Type of Excise Goods will be manufactured or stored to in the warehouse?</label
            >
            <select>
              <option>Tobacco & Related Products</option>
            </select>
          </div>
        </div>
      </div>

      <div class="btn-grp">
        <button class="draft-btn">Save a draft</button>

        <div class="right-buttons">
          <button class="previous-btn">Previous</button>
          <!-- <button class="next-btn"routerLink="/third-layout/benefit-service" style="cursor: pointer;">Next</button> -->
          <button type="submit" (click)="next()" class="next-btn">Next</button>
        </div>
      </div>
    </div>
  </div>
</div>
